events {}

http {
    # Docker's embedded DNS. Re-resolving "app" per request returns the set of replica
    # IPs and rotates through them, so requests round-robin across the app nodes.
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 80;

        location / {
            set $upstream app:8080;
            proxy_pass http://$upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Server-Sent Events need unbuffered, long-lived responses.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
