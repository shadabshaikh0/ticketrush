spring:
  application:
    name: ticketrush
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
    username: ${DB_USER:ticketrush}
    password: ${DB_PASSWORD:ticketrush}
    hikari:
      # A generous pool so many requests hit the DB *concurrently* — this is what
      # makes the naive race condition reproducible in the demo.
      maximum-pool-size: 60
      pool-name: ticketrush-pool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  web:
    resources:
      cache:
        # Demo app: always serve fresh assets so milestone updates show without a hard refresh.
        cachecontrol:
          no-store: true

server:
  port: 8080

demo:
  show-id: 1
  seat-count: 100
  # Identifies this app instance (Docker sets HOSTNAME to the container id → unique per node).
  node-name: ${NODE_NAME:${HOSTNAME:local}}
  # Set to the load balancer URL in the cluster compose; when a stampede requests
  # nodes>1 the load is fanned out here so it spreads across app instances.
  cluster-lb-url: ${CLUSTER_LB_URL:}
