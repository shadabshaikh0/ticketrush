# M3 cluster: 3 app nodes behind nginx, sharing one Postgres + Redis.
# Run with:   docker compose -f docker-compose.cluster.yml up --build --scale app=3
# Then open:  http://localhost:8080   (set "App nodes" = 3 in the UI)
#
# Demo: SYNCHRONIZED oversells (each node has its own JVM lock); REDIS_LOCK holds
# (all nodes coordinate through Redis).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticketrush
      DB_USER: ticketrush
      DB_PASSWORD: ticketrush
      REDIS_HOST: redis
      CLUSTER_LB_URL: http://nginx
    depends_on:
      db:
        condition: service_healthy
    # No host port — nginx fronts the nodes. Scale with `--scale app=3`.

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.cluster.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
