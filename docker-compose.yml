services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # No host port mapping — the app reaches it in-network as redis:6379, and this avoids
    # clashing with any Redis you already run on the host.

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticketrush
      DB_USER: ticketrush
      DB_PASSWORD: ticketrush
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
